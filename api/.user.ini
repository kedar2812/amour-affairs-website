; ============================================================
; AMOUR AFFAIRS — PHP runtime limits for the API
; ============================================================
; StackCP / most shared hosting runs PHP as CGI/FastCGI, where the
; php_value lines in .htaccess are IGNORED (those only work under
; mod_php). A .user.ini IS honoured by CGI/FastCGI, so the upload
; limits live here as the authoritative source. Apply to /api and
; everything below it. (Cache TTL for .user.ini is 5 min by default.)
; ============================================================

upload_max_filesize = 64M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 300
max_file_uploads = 50
