<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nav layout test</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/reset.css">
  <link rel="stylesheet" href="/src/styles/variables.css">
  <link rel="stylesheet" href="/src/styles/typography.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/sections/hero.css">
  <link rel="stylesheet" href="/src/styles/sections/contact.css">
  <link rel="stylesheet" href="/src/styles/service-pages.css">
  <link rel="stylesheet" href="/src/styles/films-page.css">
  <style>
    body { background: #F5EDE2; min-height: 200px; }
    .nav__logo { outline: 1px solid red; }
    .nav__links { outline: 1px solid blue; }
  </style>
</head>
<body>
  <nav class="nav" id="nav">
    <a href="/" class="nav__logo">
      <img src="/logo-full.png" alt="Amour Affairs" class="nav__logo-img" />
    </a>
    <div class="nav__links hide-mobile">
      <a href="/" class="nav__link">Home</a>
      <a href="/weddings/" class="nav__link">Weddings</a>
      <a href="/couple-shoots/" class="nav__link">Couples</a>
      <a href="/films/" class="nav__link nav__link--active">Films</a>
      <a href="/about/" class="nav__link">About</a>
      <a href="/testimonials/" class="nav__link">Testimonials</a>
      <a href="/shop/" class="nav__link">Shop</a>
      <a href="#contact" class="nav__link">Contact</a>
      <a href="https://wa.me/919921000052" target="_blank" rel="noopener" class="btn--nav-book nav__book hide-mobile">Book Now</a>
    </div>
    <div class="nav__hamburger hide-desktop" id="hamburger">
      <span></span><span></span><span></span>
    </div>
  </nav>
<pre id="m" style="position:fixed;top:90px;left:20px;font:14px monospace;color:#000"></pre>
<script>
  window.addEventListener('load', () => setTimeout(measure, 400));
  function measure() {
    const logo = document.querySelector('.nav__logo').getBoundingClientRect();
    const links = document.querySelector('.nav__links').getBoundingClientRect();
    const book = document.querySelector('.nav__book').getBoundingClientRect();
    document.getElementById('m').textContent =
      `vw=${innerWidth} logoRight=${Math.round(logo.right)} linksLeft=${Math.round(links.left)} ` +
      `clearance=${Math.round(links.left - logo.right)} bookRight=${Math.round(book.right)} rightSlack=${Math.round(innerWidth - book.right)}`;
  });
</script>
</body>
</html>
