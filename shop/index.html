<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Amour Affairs</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  
  <script type="module" src="/src/main.js"></script>

  <style>
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      overflow-x: hidden;
    }
    .shop-hero {
      width: 100vw;
      height: 100vh;
      background-color: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 1;
    }
    .shop__eyebrow {
      font-family: var(--font-body);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      opacity: 0;
      color: var(--color-text-dim);
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
    }
    .shop__title {
      font-family: var(--font-display);
      font-size: clamp(4rem, 10vw, 8rem);
      line-height: 1.1;
      padding-bottom: 0.1em;
      margin: 1rem 0;
      font-style: italic;
      color: var(--color-text); /* Fallback */
      
      /* Premium Shimmer Effect */
      background: linear-gradient(
        110deg,
        var(--color-text) 30%,
        var(--color-accent) 50%,
        var(--color-text) 70%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      
      opacity: 0;
      animation: 
        fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards,
        shimmer 5s linear infinite;
    }
    .shop__desc {
      font-family: var(--font-body);
      font-size: 1.4rem;
      line-height: 1.6;
      max-width: 600px;
      color: var(--color-text-dim);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
      padding: 0 1.5rem;
    }
    .shop__btn-wrap {
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
    
    .nav {
      background: transparent !important;
      backdrop-filter: none;
      border-bottom: none !important;
    }

    /* Additional helper for the preloader text so we can stack Amour Affairs and The Shop cleanly */
    .preloader__text-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

  
    .floating-whatsapp{position:fixed;bottom:30px;left:30px;width:60px;height:60px;background:linear-gradient(135deg,#C9A97C 0%,#9E7A4E 100%);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(158,122,78,.35),inset 0 2px 4px rgba(255,255,255,.2);z-index:9999;text-decoration:none;transition:transform .4s cubic-bezier(.175,.885,.32,1.275),box-shadow .4s ease}
    .floating-whatsapp:hover{transform:scale(1.08) translateY(-6px);box-shadow:0 16px 32px rgba(158,122,78,.45),inset 0 2px 6px rgba(255,255,255,.3);color:#fff;opacity:1}
    .floating-whatsapp:active{transform:scale(.95)}
    .floating-whatsapp svg{fill:currentColor;filter:drop-shadow(0 2px 4px rgba(0,0,0,.1))}
    .floating-whatsapp::after{content:'';position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;border-radius:50%;border:1px solid rgba(255,255,255,.2);pointer-events:none}
    .floating-whatsapp::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;background-color:#C9A97C;z-index:-1;opacity:.5;animation:wa-pulse 2.5s infinite}
    @keyframes wa-pulse{0%{transform:scale(1);opacity:.5}70%{transform:scale(1.4);opacity:0}100%{transform:scale(1.4);opacity:0}}
    @media(max-width:768px){.floating-whatsapp{bottom:20px;left:20px;width:54px;height:54px}.floating-whatsapp svg{width:28px;height:28px}}
  </style>
</head>
<body class="is-loading">

  <!-- PRELOADER -->
  <div class="preloader" id="preloader">
    <img src="/logo.svg" alt="Amour Affairs Logo" class="preloader__logo-svg" />
    <div class="preloader__progress">
      <div class="preloader__progress-fill"></div>
    </div>
  </div>

  <!-- CUSTOM CURSOR -->


  <!-- NAVIGATION -->
  <nav class="nav" id="nav">
    <a href="/" class="nav__logo">
      <img src="/logo-full.png" alt="Amour Affairs" class="nav__logo-img" />
    </a>
  </nav>

  <section class="shop-hero">
    <span class="shop__eyebrow">Curated For You</span>
    <h1 class="shop__title">Coming Soon</h1>
    <p class="shop__desc">We are curating a highly exclusive collection of fine art premium albums, cinematic CDs, and prints. Check back soon for the launch of The Shop.</p>
    <div class="shop__btn-wrap">
      <a href="/" class="btn--nav-book">Return Home</a>
    </div>
  </section>


  <!-- Floating WhatsApp Button -->
  <a href="https://wa.me/919921000052" class="floating-whatsapp" target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor" width="34" height="34"><path d="M12.031 0C5.397 0 0 5.397 0 12.031c0 2.115.553 4.181 1.606 6.002L.15 23.363l5.485-1.439a11.967 11.967 0 006.396 1.834h.005c6.634 0 12.03-5.398 12.03-12.032C24.066 5.397 18.665 0 12.031 0zm0 21.758c-1.782 0-3.528-.48-5.06-1.388l-.363-.214-3.766.988.995-3.674-.235-.373A9.972 9.972 0 012.001 12.03c0-5.526 4.498-10.024 10.03-10.024 5.525 0 10.024 4.497 10.024 10.024 0 5.526-4.499 10.028-10.024 10.028zm5.508-7.531c-.302-.152-1.785-.882-2.062-.982-.277-.101-.48-.152-.682.152-.202.304-.78 .982-.956 1.185-.177.202-.353.227-.655.076-2.04-.982-3.414-1.92-4.636-3.992-.126-.214.126-.202.417-.783.101-.202.05-.38-.025-.532-.076-.152-.682-1.643-.933-2.25-.246-.593-.497-.512-.682-.522-.177-.01-.38-.01-.583-.01-.202 0-.53.076-.807.38-.277.303-1.06 1.036-1.06 2.527s1.085 2.932 1.236 3.134c.152.202 2.138 3.264 5.176 4.573.722.311 1.285.497 1.724.636.724.23 1.384.197 1.905.12.584-.087 1.785-.73 2.037-1.436.252-.705.252-1.309.177-1.436-.076-.126-.277-.202-.579-.354z"/></svg>
  </a>
</body>
</html>
