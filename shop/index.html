<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Amour Affairs</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  
  <script type="module" src="/src/main.js"></script>

  <style>
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      overflow-x: hidden;
    }
    .shop-hero {
      width: 100vw;
      height: 100vh;
      background-color: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 1;
    }
    .shop__eyebrow {
      font-family: var(--font-body);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      opacity: 0;
      color: var(--color-text-dim);
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
    }
    .shop__title {
      font-family: var(--font-display);
      font-size: clamp(4rem, 10vw, 8rem);
      line-height: 1.1;
      padding-bottom: 0.1em;
      margin: 1rem 0;
      font-style: italic;
      color: var(--color-text); /* Fallback */
      
      /* Premium Shimmer Effect */
      background: linear-gradient(
        110deg,
        var(--color-text) 30%,
        var(--color-accent) 50%,
        var(--color-text) 70%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      
      opacity: 0;
      animation: 
        fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards,
        shimmer 5s linear infinite;
    }
    .shop__desc {
      font-family: var(--font-display);
      font-size: 1.4rem;
      line-height: 1.6;
      max-width: 600px;
      color: var(--color-text-dim);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
      padding: 0 1.5rem;
    }
    .shop__btn-wrap {
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
    
    .nav {
      background: transparent !important;
      backdrop-filter: none;
      border-bottom: none !important;
    }

    /* Additional helper for the preloader text so we can stack Amour Affairs and The Shop cleanly */
    .preloader__text-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

  </style>
</head>
<body class="is-loading">

  <!-- PRELOADER -->
  <div class="preloader" id="preloader">
    <img src="/logo.svg" alt="Amour Affairs Logo" class="preloader__logo-svg" />
    <div class="preloader__progress">
      <div class="preloader__progress-fill"></div>
    </div>
  </div>

  <!-- CUSTOM CURSOR -->
  <div class="cursor-dot" style="opacity:0"></div>
  <div class="cursor-ring" style="opacity:0"></div>

  <!-- NAVIGATION -->
  <nav class="nav" id="nav">
    <a href="/" class="nav__logo">
      <img src="/logo.png" alt="" class="nav__logo-img" />
      <span class="logo-amour">Amour</span><span class="logo-affairs">Affairs</span><sup>®</sup>
    </a>
  </nav>

  <section class="shop-hero">
    <span class="shop__eyebrow">Curated For You</span>
    <h1 class="shop__title">Coming Soon</h1>
    <p class="shop__desc">We are curating a highly exclusive collection of fine art premium albums, cinematic CDs, and prints. Check back soon for the launch of The Shop.</p>
    <div class="shop__btn-wrap">
      <a href="/" class="btn--nav-book">Return Home</a>
    </div>
  </section>

</body>
</html>
